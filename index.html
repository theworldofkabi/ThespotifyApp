<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Playing</title>
  <link rel="icon" type="image/svg+xml" href="spotify-logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="spotify-icon-192.png" />
  <link rel="apple-touch-icon" href="spotify-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      padding-top: max(clamp(10px, 2.5vmin, 22px), env(safe-area-inset-top));
      padding-right: max(clamp(14px, 3vmin, 28px), env(safe-area-inset-right));
      padding-bottom: clamp(10px, 2.5vmin, 22px);
      padding-left: max(clamp(14px, 3vmin, 28px), env(safe-area-inset-left));
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
      pointer-events: none;
    }

    .navbar-logo {
      display: block;
      width: clamp(24px, 5vmin, 40px);
      height: clamp(24px, 5vmin, 40px);
      object-fit: contain;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      background: #000;
      display: block;
    }

    @media (max-aspect-ratio: 1 / 1) {
      video {
        object-fit: contain;
      }
    }

    .open-fallback {
      position: fixed;
      left: 50%;
      bottom: max(clamp(20px, 5vmin, 36px), env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 999px;
      background: #1ed760;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .open-fallback.visible {
      display: inline-flex;
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Spotify branding">
    <img class="navbar-logo" src="spotify-logo.svg" alt="Spotify" />
  </nav>
  <video
    id="video"
    src="New%20Project%20%5BC3E1D98%5D.mp4"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>
  <a id="openFallback" class="open-fallback" href="https://open.spotify.com/">Open Spotify</a>

  <script>
    const video = document.getElementById("video");
    const openFallback = document.getElementById("openFallback");
    const ANDROID_SPOTIFY_INTENT =
      "intent://#Intent;scheme=spotify;package=com.spotify.music;action=android.intent.action.VIEW;S.browser_fallback_url=https%3A%2F%2Fopen.spotify.com%2F;end";
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS =
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let launched = false;
    let fullscreenBlocked = false;

    function updateVideoFit() {
      if (!video.videoWidth || !video.videoHeight || !window.innerHeight) return;
      const videoAspect = video.videoWidth / video.videoHeight;
      const viewportAspect = window.innerWidth / window.innerHeight;
      const aspectRatioDiff = Math.max(
        videoAspect / viewportAspect,
        viewportAspect / videoAspect
      );
      // Fill edge-to-edge when screen and video proportions are close; avoid heavy cropping otherwise.
      video.style.objectFit = aspectRatioDiff <= 1.45 ? "cover" : "contain";
    }

    function openNativeOrFallback(fromUserGesture) {
      if (isAndroid) {
        openFallback.href = ANDROID_SPOTIFY_INTENT;
        // Android Chrome blocks ungestured intent:// navigation; wait for a valid tap when required.
        if (fromUserGesture || navigator.userActivation?.isActive) {
          window.location.href = ANDROID_SPOTIFY_INTENT;
        } else {
          openFallback.classList.add("visible");
        }
        return;
      }

      if (isIOS) {
        openFallback.href = "spotify://";
        if (fromUserGesture || navigator.userActivation?.isActive) {
          window.location.href = "spotify://";
          setTimeout(() => {
            if (document.visibilityState === "visible") {
              window.location.replace("https://open.spotify.com/");
            }
          }, 1200);
        } else {
          openFallback.classList.add("visible");
        }
        return;
      }

      try {
        window.location.href = "spotify:";
      } catch {
        // Ignore if external protocol navigation is blocked.
      }
    }

    async function launchSpotify(fromUserGesture = false) {
      if (launched && !fromUserGesture) return;
      launched = true;

      const isLocal =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      if (isLocal) {
        try {
          const res = await fetch("/open-spotify", { method: "POST" });
          if (res.ok) return;
        } catch {
          // Fall back to URI launch if the local helper endpoint is unavailable.
        }
      }

      openNativeOrFallback(fromUserGesture);
    }

    async function enterFullscreen() {
      if (fullscreenBlocked || document.fullscreenElement || document.webkitFullscreenElement) {
        return;
      }
      const root = document.documentElement;
      const requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!requestFs) {
        fullscreenBlocked = true;
        return;
      }
      try {
        await requestFs.call(root);
      } catch {
        // Avoid repeatedly requesting fullscreen if the browser or user blocks it.
        fullscreenBlocked = true;
      }
    }

    async function startPlayback() {
      // Always start muted on launch to avoid browser audio-autoplay permission prompts.
      video.muted = true;
      try {
        await video.play();
      } catch {
        // Wait for user click/tap if autoplay is disabled by browser settings.
      }
    }

    document.addEventListener("click", async (e) => {
      if (e.target === openFallback) return;
      if (video.ended) {
        launchSpotify(true);
        return;
      }
      enterFullscreen();
      video.muted = false;
      if (video.paused) {
        try {
          await video.play();
        } catch {}
      }
    });

    openFallback.addEventListener("click", () => {
      if (isIOS) {
        setTimeout(() => {
          if (document.visibilityState === "visible") {
            window.location.replace("https://open.spotify.com/");
          }
        }, 1200);
      }
    });

    video.addEventListener("loadedmetadata", updateVideoFit);
    window.addEventListener("resize", updateVideoFit);
    window.addEventListener("orientationchange", updateVideoFit);
    video.addEventListener("ended", () => launchSpotify(false));
    window.addEventListener("DOMContentLoaded", startPlayback);
  </script>
</body>
</html>
