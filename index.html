<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Playing</title>
  <link rel="icon" type="image/svg+xml" href="spotify-logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="spotify-icon-192.png" />
  <link rel="apple-touch-icon" href="spotify-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      background: #000;
      display: block;
    }

    @media (max-aspect-ratio: 1 / 1) {
      video {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <video
    id="video"
    src="New%20Project%20%5BC3E1D98%5D.mp4"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>

  <script>
    const video = document.getElementById("video");
    const ANDROID_SPOTIFY_INTENT_DIRECT =
      "intent://open.spotify.com/#Intent;scheme=https;package=com.spotify.music;action=android.intent.action.VIEW;end";
    const ANDROID_SPOTIFY_INTENT_WITH_FALLBACK =
      "intent://open.spotify.com/#Intent;scheme=https;package=com.spotify.music;action=android.intent.action.VIEW;S.browser_fallback_url=https%3A%2F%2Fopen.spotify.com%2F;end";
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS =
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let videoCompleted = false;
    let launchScheduled = false;
    let launchTimer = null;
    let autoAttempted = false;
    let tapLaunched = false;
    let leftForSpotify = false;
    let fullscreenBlocked = false;

    function updateVideoFit() {
      if (!video.videoWidth || !video.videoHeight || !window.innerHeight) return;
      const videoAspect = video.videoWidth / video.videoHeight;
      const viewportAspect = window.innerWidth / window.innerHeight;
      const aspectRatioDiff = Math.max(
        videoAspect / viewportAspect,
        viewportAspect / videoAspect
      );
      // Fill edge-to-edge when screen and video proportions are close; avoid heavy cropping otherwise.
      video.style.objectFit = aspectRatioDiff <= 1.45 ? "cover" : "contain";
    }

    async function launchSpotify(fromUserTap) {
      if (leftForSpotify) return;
      if (!fromUserTap && autoAttempted) return;
      if (fromUserTap && tapLaunched) return;

      if (launchTimer !== null) {
        clearTimeout(launchTimer);
        launchTimer = null;
      }

      if (fromUserTap) {
        tapLaunched = true;
        autoAttempted = true;
      } else {
        autoAttempted = true;
      }

      const isLocal =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      if (isLocal) {
        try {
          const res = await fetch("/open-spotify", { method: "POST" });
          if (res.ok) {
            leftForSpotify = true;
            return;
          }
        } catch {
          // Fall back to URI launch if the local helper endpoint is unavailable.
        }
      }

      if (isAndroid) {
        const hasGesture =
          fromUserTap || Boolean(navigator.userActivation && navigator.userActivation.isActive);
        const intentUrl = hasGesture
          ? ANDROID_SPOTIFY_INTENT_WITH_FALLBACK
          : ANDROID_SPOTIFY_INTENT_DIRECT;
        try {
          window.location.href = intentUrl;
        } catch {
          // Gracefully ignore if browser security blocks automatic intent navigation.
        }
        return;
      }

      if (isIOS) {
        try {
          window.location.href = "spotify://";
          if (fromUserTap) {
            setTimeout(() => {
              if (!leftForSpotify && document.visibilityState === "visible") {
                window.location.replace("https://open.spotify.com/");
              }
            }, 1500);
          }
        } catch {
          // Gracefully ignore if browser security blocks external navigation.
        }
        return;
      }

      try {
        window.location.href = "spotify:";
      } catch {
        // Gracefully ignore if external protocol navigation is blocked.
      }
    }

    async function enterFullscreen() {
      if (fullscreenBlocked || document.fullscreenElement || document.webkitFullscreenElement) {
        return;
      }
      const root = document.documentElement;
      const requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!requestFs) {
        fullscreenBlocked = true;
        return;
      }
      try {
        await requestFs.call(root);
      } catch {
        fullscreenBlocked = true;
      }
    }

    async function startPlayback() {
      // Always start muted on launch to avoid browser audio-autoplay permission prompts.
      video.muted = true;
      try {
        await video.play();
      } catch {
        // Wait for user click/tap if autoplay is disabled by browser settings.
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && (autoAttempted || tapLaunched)) {
        leftForSpotify = true;
      }
    });

    document.addEventListener("click", async () => {
      if (videoCompleted) {
        launchSpotify(true);
        return;
      }

      if (!isAndroid) {
        enterFullscreen();
      }
      if (video.muted) {
        video.muted = false;
      }
      if (video.paused && !video.ended) {
        try {
          await video.play();
        } catch {}
      }
    });

    video.addEventListener("ended", () => {
      videoCompleted = true;
      if (launchScheduled || autoAttempted || leftForSpotify) return;
      launchScheduled = true;
      launchTimer = setTimeout(() => {
        launchTimer = null;
        launchSpotify(false);
      }, 2000);
    });

    video.addEventListener("loadedmetadata", updateVideoFit);
    window.addEventListener("resize", updateVideoFit);
    window.addEventListener("orientationchange", updateVideoFit);
    window.addEventListener("DOMContentLoaded", startPlayback);
  </script>
</body>
</html>
